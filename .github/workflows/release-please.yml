name: Release Please

# Every merge to main updates a standing "Release PR" that accumulates the
# changelog and the next version. Merging that PR tags the release and runs
# GoReleaser. Version bump follows conventional commits: feat -> minor,
# fix/perf/refactor -> patch, docs/test/ci/chore -> no release. Breaking
# changes stay on minor while the project is pre-1.0.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # The tag release-please pushes with GITHUB_TOKEN cannot trigger the tag-based
  # Release workflow (GitHub does not chain workflow-created events), so call it
  # directly here.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
