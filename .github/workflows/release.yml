name: Release

on:
  # Manually pushed tags still release.
  push:
    tags:
      - "v*"
  # Called by release-please.yml once it has tagged the release.
  workflow_call:
    inputs:
      tag:
        description: Tag to build; defaults to the tag that triggered the push.
        type: string
        required: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # full history + tags for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Sanity checks before releasing
        run: |
          go vet ./...
          go test ./... -race
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
